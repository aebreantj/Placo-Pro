<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2639"/>
      <stop offset="100%" stop-color="#0B111A"/>
    </linearGradient>
    <linearGradient id="yellow" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD84D"/>
      <stop offset="100%" stop-color="#F5B800"/>
    </linearGradient>
    <linearGradient id="blue" x1="36" y1="30" x2="108" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- Atelier slate rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)" stroke="#2A3B55" stroke-width="4"/>
  <!-- Subtle technical blueprint grid -->
  <g stroke="#23354F" stroke-width="1" opacity="0.65">
    <line x1="32" y1="12" x2="32" y2="116"/>
    <line x1="64" y1="12" x2="64" y2="116"/>
    <line x1="96" y1="12" x2="96" y2="116"/>
    <line x1="12" y1="32" x2="116" y2="32"/>
    <line x1="12" y1="64" x2="116" y2="64"/>
    <line x1="12" y1="96" x2="116" y2="96"/>
  </g>
  <!-- Drywall panels / technical stack in blueprint blue & white -->
  <rect x="46" y="24" width="54" height="64" rx="5" fill="#132238" stroke="url(#blue)" stroke-width="3.5"/>
  <!-- Stud / joint dashed vertical line -->
  <line x1="73" y1="26" x2="73" y2="86" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- Opening / cutout detail -->
  <rect x="57" y="44" width="32" height="24" rx="2" fill="#0B111A" stroke="#38BDF8" stroke-width="2.2"/>
  <line x1="57" y1="44" x2="89" y2="68" stroke="#38BDF8" stroke-width="1.2" opacity="0.5"/>
  <!-- Measuring-tape yellow carpenter L-square -->
  <path d="M22 24 H36 V92 H104 V106 H22 Z" fill="url(#yellow)" stroke="#0B111A" stroke-width="2" stroke-linejoin="round"/>
  <!-- Ruler graduation ticks -->
  <g stroke="#0F172A" stroke-width="2" stroke-linecap="round">
    <line x1="22" y1="38" x2="29" y2="38"/>
    <line x1="22" y1="50" x2="31" y2="50"/>
    <line x1="22" y1="62" x2="29" y2="62"/>
    <line x1="22" y1="74" x2="31" y2="74"/>
    <line x1="22" y1="86" x2="29" y2="86"/>
    <line x1="48" y1="106" x2="48" y2="99"/>
    <line x1="60" y1="106" x2="60" y2="97"/>
    <line x1="72" y1="106" x2="72" y2="99"/>
    <line x1="84" y1="106" x2="84" y2="97"/>
    <line x1="96" y1="106" x2="96" y2="99"/>
  </g>
</svg>
